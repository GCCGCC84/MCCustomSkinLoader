name: CI Fix Verification

# Manual workflow used to verify harness fixes on a subset of the test matrix without
# touching the release/object-storage publishing jobs.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Comma separated Minecraft versions to test (empty = full matrix)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build
        with:
          artifact-name: CustomSkinLoader-Verify-${{ github.run_number }}

  test:
    name: Test
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      artifact-name: CustomSkinLoader-Verify-${{ github.run_number }}
      versions: ${{ inputs.versions }}
