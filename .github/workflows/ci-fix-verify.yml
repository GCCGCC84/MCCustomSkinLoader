name: CI Fix Verification

# Manual workflow used to verify harness fixes on a subset of the test matrix without
# touching the release/object-storage publishing jobs.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Comma separated Minecraft versions to test (empty = full matrix)
        required: false
        type: string
        default: ''
  # workflow_dispatch is only offered for workflows that exist on the default branch, so this
  # branch also runs the verification on push with the version list below.
  push:
    branches: [ci/matrix-harness-fix]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build
        with:
          artifact-name: CustomSkinLoader-Verify-${{ github.run_number }}

  test:
    name: Test
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      artifact-name: CustomSkinLoader-Verify-${{ github.run_number }}
      versions: ${{ github.event_name == 'workflow_dispatch' && inputs.versions || '1.16.5,1.20.2,1.21.2,1.21.5,1.21.8,26.3,1.21.11,26.2' }}
