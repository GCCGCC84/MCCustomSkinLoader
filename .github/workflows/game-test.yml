name: Game Test

# Full in-game compatibility test:
# builds the Universal jar, prepares one shared download cache per Minecraft
# version era, then for every Minecraft version in build.info.json starts a
# vanilla server and launches a real client (Mesa3D/llvmpipe) for each mod
# loader available for that version, joins the server and verifies that
# CustomSkinLoader applied the local test skin and cape.
#
# Runs on every push and pull request. The optional workflow_dispatch inputs can
# restrict the run to a subset of game versions or loaders.

on:
  push:
    branches-ignore: ['diagnostic/**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      game_versions:
        description: 'Comma-separated Minecraft versions (empty = all from build.info.json)'
        required: false
        default: ''
      loaders:
        description: 'Comma-separated loaders (fabric,forge,neoforge,quilt; empty = all supported)'
        required: false
        default: ''
      pairs:
        description: 'Optional comma-separated mc:loader pairs; overrides broad version/loader selection'
        required: false
        default: ''
      max_parallel:
        description: 'Maximum number of parallel Minecraft version jobs'
        required: false
        default: '32'
      skip_sound_assets:
        description: 'Skip downloading sound assets (smaller caches, no effect on visuals)'
        type: boolean
        default: false
      join_timeout:
        description: 'Seconds to wait for the client to join the server'
        required: false
        default: '300'
      quilt_system_libraries:
        description: "Quilt system libraries: '' = built-in list of affected combos, 'all', 'none', or comma-separated mc:loader pairs"
        required: false
        default: ''
      deferred_join:
        description: "Deferred join: '' = built-in list of known early-connect combos, 'all', 'none', or comma-separated mc:loader pairs"
        required: false
        default: ''

concurrency:
  group: game-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build
        with:
          artifact-name: CustomSkinLoader-GameTest-${{ github.run_number }}

  prepare:
    name: Prepare Matrix
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      cache_matrix: ${{ steps.matrix.outputs.cache_matrix }}
      cache_count: ${{ steps.matrix.outputs.cache_count }}
    steps:
      - uses: actions/checkout@v7

      - name: Build test matrix
        id: matrix
        shell: pwsh
        env:
          SKIP_SOUND_ASSETS: ${{ github.event.inputs.skip_sound_assets }}
        run: |
          $skipSounds = $env:SKIP_SOUND_ASSETS -eq 'true'
          ./.github/scripts/game-test/Get-GameTestMatrix.ps1 `
            -GameVersions '${{ github.event.inputs.game_versions }}' `
            -Loaders '${{ github.event.inputs.loaders }}' `
            -Pairs '${{ github.event.inputs.pairs }}' `
            -CacheDir '${{ runner.temp }}/csl-matrix-cache' `
            -SkipSoundAssets:$skipSounds

      - name: Prepare cache directories
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path '${{ runner.temp }}/mesa-cache' | Out-Null

      - name: Restore Mesa3D cache
        id: mesa-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mesa-cache
          key: mesa3d-msvc-26.2.0

      - name: Download Mesa3D
        if: steps.mesa-restore.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Import-Module ./.github/scripts/game-test/lib/Mesa3D.psm1 -Force
          Install-Mesa3D -CacheDir '${{ runner.temp }}/mesa-cache' -Destination '${{ runner.temp }}/mesa-deploy' | Out-Null

      - name: Save Mesa3D cache
        if: steps.mesa-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/mesa-cache
          key: mesa3d-msvc-26.2.0

      - name: Upload matrix
        uses: actions/upload-artifact@v7
        with:
          name: game-test-matrix
          path: ${{ runner.temp }}/csl-matrix-cache
          if-no-files-found: ignore
          retention-days: 7

  prepare-cache:
    name: Prepare Cache
    needs: [prepare]
    if: needs.prepare.outputs.cache_count != '0'
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.cache_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path '${{ runner.temp }}/shared-cache' | Out-Null

      - name: Restore shared cache
        id: shared-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/shared-cache
          key: ${{ matrix.key }}
          restore-keys: |
            mc-shared-win-

      - name: Prepare shared cache
        if: steps.shared-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          SKIP_SOUND_ASSETS: ${{ github.event.inputs.skip_sound_assets }}
          CACHE_ENTRIES: ${{ matrix.entries }}
        run: |
          $skipSounds = $env:SKIP_SOUND_ASSETS -eq 'true'
          ./.github/scripts/game-test/Initialize-GameTestCache.ps1 `
            -Entries $env:CACHE_ENTRIES `
            -CacheDir "$env:RUNNER_TEMP/shared-cache" `
            -WorkDir "$env:RUNNER_TEMP/cache-work" `
            -SkipSoundAssets:$skipSounds `
            -ThrottleLimit 16

      - name: Save shared cache
        if: steps.shared-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/shared-cache
          key: ${{ matrix.key }}

  test:
    name: ${{ matrix.mc }}
    needs: [build, prepare, prepare-cache]
    if: needs.prepare.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.max_parallel || '32') }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Download mod artifact
        uses: actions/download-artifact@v8
        with:
          name: CustomSkinLoader-GameTest-${{ github.run_number }}
          path: artifact

      - name: Locate mod jar
        id: modjar
        shell: pwsh
        run: |
          $jar = Get-ChildItem 'artifact' -Filter '*.jar' -Recurse |
            Where-Object { $_.Name -notlike '*-sources.jar' } |
            Select-Object -First 1
          if (-not $jar) { throw 'No mod jar found in the build artifact' }
          "path=$($jar.FullName)" >> $env:GITHUB_OUTPUT

      - name: Restore shared cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/shared-cache
          key: ${{ matrix.cacheKey }}
          restore-keys: |
            mc-shared-win-

      - name: Restore Mesa3D cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/mesa-cache
          key: mesa3d-msvc-26.2.0

      - name: Run game tests
        shell: pwsh
        env:
          MC_VERSION: ${{ matrix.mc }}
          JAVA_MAJOR: ${{ matrix.java }}
          LOADERS: ${{ matrix.loaders }}
          MOD_JAR: ${{ steps.modjar.outputs.path }}
          JOIN_TIMEOUT: ${{ github.event.inputs.join_timeout || '300' }}
          SKIP_SOUND_ASSETS: ${{ github.event.inputs.skip_sound_assets }}
          QUILT_SYSTEM_LIBRARIES: ${{ github.event.inputs.quilt_system_libraries }}
          DEFERRED_JOIN: ${{ github.event.inputs.deferred_join }}
          MESA_CACHE: ${{ runner.temp }}/mesa-cache
        run: |
          $loaders = $env:LOADERS | ConvertFrom-Json
          $skipSounds = $env:SKIP_SOUND_ASSETS -eq 'true'
          # Deferred join: the vanilla --server auto-connect opens the connection before
          # the first resource reload finishes. A no-CSL control reproduced the resulting
          # Shader NPE on 1.16-1.20 (clients render a screen too early), and Forge 1.15.1
          # re-enters ConnectingScreen in a loop, so these combos reach the server through
          # the title screen after the first resource reload instead.
          $deferredJoinDefault = @('1.15.1:forge', '1.16:fabric', '1.17:fabric')
          # Quilt 0.30.1 mixes com.mojang:blocklist and com.mojang:patchy across two class
          # loaders on these versions, so ServiceLoader rejects MojangBlockListSupplier and
          # the connection thread dies. Declaring both jars as loader.systemLibraries keeps
          # them in one loader (verified on Quilt 1.17-1.18.1).
          $quiltSystemLibrariesDefault = @('1.17:quilt', '1.17.1:quilt', '1.18:quilt', '1.18.1:quilt')

          function Test-ComboPolicy {
            param([string]$Policy, [string]$Combo)
            if ($Policy -eq 'true' -or $Policy -eq 'all') { return $true }
            if ($Policy -eq 'false' -or $Policy -eq 'none') { return $false }
            $list = @($Policy -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
            return ($list -contains $Combo)
          }

          function Test-DefaultDeferredJoin {
            param([string]$McVersion, [string]$Loader)
            # Quote the version explicitly: "$env:MC_VERSION:..." would parse the colon as
            # part of the variable name and silently drop the version.
            $combo = "${McVersion}:${Loader}"
            if ($deferredJoinDefault -contains $combo) { return $true }
            # Quilt renders the first world frame before the resource reload is complete on
            # every version that still uses the --server auto-connect (9 of 13 quilt combos
            # failed this way in runs 35855058233 and 36023872722); deferred joining fixed
            # every quilt combo that was retested.
            return ($Loader -eq 'quilt' -and $McVersion -match '^1\.(13|14|15|16|17|18|19|20)(\.\d+)?$' -and $McVersion -notmatch '^1\.20\.[2-9]')
          }

          $failures = 0
          foreach ($loader in $loaders) {
            $resultDir = Join-Path 'test-results' $loader.name
            $combo = "${env:MC_VERSION}:$($loader.name)"
            if ($env:DEFERRED_JOIN) {
              $deferredJoin = Test-ComboPolicy -Policy $env:DEFERRED_JOIN -Combo $combo
            } else {
              $deferredJoin = Test-DefaultDeferredJoin -McVersion $env:MC_VERSION -Loader $loader.name
            }
            if ($env:QUILT_SYSTEM_LIBRARIES) {
              $quiltSystemLibraries = Test-ComboPolicy -Policy $env:QUILT_SYSTEM_LIBRARIES -Combo $combo
            } else {
              $quiltSystemLibraries = $quiltSystemLibrariesDefault -contains $combo
            }
            $quiltSystemLibraries = $quiltSystemLibraries -and $loader.name -eq 'quilt'
            if ($deferredJoin -or $quiltSystemLibraries) {
              Write-Host "$combo uses deferredJoin=$deferredJoin quiltSystemLibraries=$quiltSystemLibraries"
            }
            & ./.github/scripts/game-test/Test-GameCombo.ps1 `
              -McVersion $env:MC_VERSION `
              -Loader $loader.name `
              -LoaderVersion $loader.version `
              -ModJar $env:MOD_JAR `
              -JavaHome $env:JAVA_HOME `
              -JavaMajor $env:JAVA_MAJOR `
              -WorkDir "$env:RUNNER_TEMP/game-test/$env:MC_VERSION/$($loader.name)" `
              -CacheDir "$env:RUNNER_TEMP/shared-cache" `
              -MesaCacheDir $env:MESA_CACHE `
              -ResultDir $resultDir `
              -JoinTimeoutSeconds ([int]$env:JOIN_TIMEOUT) `
              -QuiltSystemLibraries:$quiltSystemLibraries `
              -DeferredJoin:$deferredJoin `
              -SkipSoundAssets:$skipSounds
            if ($LASTEXITCODE -ne 0) {
              $failures++
              Write-Warning "$($loader.name) failed for Minecraft $env:MC_VERSION"
            }
          }
          if ($failures -gt 0) {
            throw "$failures loader(s) failed for Minecraft $env:MC_VERSION"
          }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: game-test-results-${{ matrix.mc }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Report
    needs: [prepare, test]
    if: always()
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all results
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: game-test-results-*
          path: test-results

      - name: Merge results
        shell: pwsh
        env:
          EXPECTED_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: ./.github/scripts/game-test/Merge-GameTestResults.ps1 -ResultsDir test-results -ExpectedMatrixJson $env:EXPECTED_MATRIX
