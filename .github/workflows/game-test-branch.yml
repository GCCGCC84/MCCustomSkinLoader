# Verification scaffolding for the throw-away branch ci/game-test-workarounds: it runs the game tests
# for that branch without publishing a release, so the test-agent workarounds can be checked against
# CI. Delete this file together with the branch.
name: Game Test (verification branch)

on:
  push:
    branches: ['ci/game-test-workarounds']
  workflow_dispatch:
    inputs:
      game_versions:
        description: 'Comma-separated Minecraft versions (empty = full matrix)'
        required: false
        default: '' 

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build
        with:
          artifact-name: CustomSkinLoader-Verify-${{ github.run_number }}

  test:
    name: Test
    needs: build
    uses: ./.github/workflows/test.yml
    with:
      artifact-name: CustomSkinLoader-Verify-${{ github.run_number }}
      # Targeted iteration: the affected versions only, so a push gives feedback in a few minutes.
      # Set to '' (or dispatch the workflow with the input) for the final full-matrix run.
      game-versions: ${{ github.event.inputs.game_versions || '1.13.2,1.14,1.14.1,1.14.4,1.15,1.15.1,1.15.2,1.16.5,1.17,1.17.1,1.18.1,1.19.1' }}
