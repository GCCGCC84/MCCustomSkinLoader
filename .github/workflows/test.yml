name: Test

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Name of the artifact uploaded by the build action
        required: true
        type: string

jobs:
  prepare:
    name: Prepare Test Matrix
    runs-on: windows-latest
    timeout-minutes: 360
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare test matrix
        id: prepare
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path run | Out-Null
          Get-ChildItem -LiteralPath Test/run -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination run -Recurse -Force
          }
          ./Test/gradlew.bat -p Test build --console=plain
          ./.github/scripts/Prepare-TestMatrix.ps1

      - name: Cache run
        uses: actions/cache@v6
        with:
          path: run
          key: test-run-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            test-run-${{ runner.os }}-

  test:
    name: Test ${{ matrix.version }}
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Restore run
        uses: actions/cache/restore@v6
        with:
          path: run
          key: test-run-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            test-run-${{ runner.os }}-

      - name: Restore git-managed files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path run | Out-Null
          Get-ChildItem -LiteralPath Test/run -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination run -Recurse -Force
          }

      - name: Setup Mesa3D
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path mesa | Out-Null
          gh release download --repo pal1000/mesa-dist-win --pattern 'mesa3d-*-release-msvc.7z' --dir mesa --clobber
          $archive = Get-ChildItem -LiteralPath mesa -Filter '*.7z' | Select-Object -First 1
          7z x $archive.FullName '-omesa\extracted' -y | Out-Null
          Copy-Item -Path 'mesa\extracted\x64\*.dll' -Destination "$env:JAVA_HOME\bin" -Force
          'GALLIUM_DRIVER=llvmpipe' | Out-File -FilePath $env:GITHUB_ENV -Append
          'LIBGL_ALWAYS_SOFTWARE=1' | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: run/client/mods

      - name: Run test
        shell: pwsh
        run: ./.github/scripts/Run-TestJob.ps1 -MinecraftVersion '${{ matrix.version }}' -Clients '${{ join(matrix.clients, ',') }}'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.version }}
          path: |
            run/client/crash-reports
            run/client/logs
            run/client/CustomSkinLoader/CustomSkinLoader.log
            run/client/hs_err*
            run/client/screenshots
          if-no-files-found: ignore
